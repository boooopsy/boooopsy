<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Thread</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="top-nav">
        <div class="header-left">
            <h1>The Daily Thread</h1>
            <nav class="breadcrumbs">
                <a href="#">Home</a> &raquo; <span>Feed</span>
            </nav>
        </div>
        <div id="auth-section" class="auth-group">
            <div class="search-controls">
                <input type="text" id="tag-search-input" placeholder="Search tags (e.g. 'updates')...">
            </div>

            <div class="view-controls">
                <span class="control-label">View:</span>
                <label class="elastic-switch view-switch" title="Toggle Cards/List">
                    <input type="checkbox" id="view-toggle-checkbox">
                    <span class="slider">
                        <svg class="icon cards-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line></svg>
                        <svg class="icon list-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    </span>
                </label>
            </div>

            <label class="elastic-switch" title="Toggle Theme">
                <input type="checkbox" id="theme-toggle-checkbox">
                <span class="slider">
                    <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </span>
            </label>
            <button id="logout-btn" class="auth-btn hidden">Logout</button>
        </div>
    </header>
    
    <div class="search-results-line-wrapper">
        <div id="search-status-line" class="hidden">
            <span id="results-count-text"></span>
            <div id="search-nav-buttons" class="hidden">
                <button onclick="navigateSearchResult(-1)" class="results-nav-btn">&lt;</button>
                <button onclick="navigateSearchResult(1)" class="results-nav-btn">&gt;</button>
            </div>
        </div>
    </div>

    <div class="layout-wrapper">
        <main class="feed-container" id="feed">
            <div id="loading-spinner">Loading logs from UTC...</div>
        </main>

        <aside class="timeline-container">
            <div class="timeline-track" id="timeline"></div>
        </aside>
    </div>

    <button id="admin-fab" class="fab hidden">✎</button>

    <div id="admin-modal" class="modal hidden">
        <div class="modal-content admin-panel">
            <div class="modal-header">
                <div class="tabs">
                    <button class="tab active" data-target="write-tab">Write / Edit Post</button>
                    <button class="tab" data-target="manage-tab">Manage Posts</button>
                </div>
                <button id="close-modal" class="icon-btn">✕</button>
            </div>
            
            <div id="write-tab" class="tab-content active">
                <div class="metadata-inputs">
                    <input type="text" id="post-title-input" placeholder="Post Title (Optional - first few words picked if empty)">
                    <input type="text" id="post-tags-input" placeholder="Tags (Separate with commas: updates, features, logs)">
                </div>

                <div class="editor-toolbar">
                    <button onclick="document.execCommand('bold')"><b>B</b></button>
                    <button onclick="document.execCommand('italic')"><i>I</i></button>
                    <button onclick="document.execCommand('insertUnorderedList')">Bullet List</button>
                    <button onclick="document.execCommand('formatBlock', false, 'blockquote')">Quote</button>
                    <button onclick="document.execCommand('formatBlock', false, 'pre')">Code</button>
                    <button onclick="document.execCommand('removeFormat')">Clear Format</button>
                    <label class="custom-file-upload">
                        📷 Insert Image
                        <input type="file" id="image-upload" accept="image/*">
                    </label>
                </div>
                
                <div id="image-tools" class="editor-toolbar secondary-toolbar hidden">
                    <span style="font-size: 0.8rem; color: var(--text-muted); margin-right: 10px;">Image Wrap:</span>
                    <button onclick="modifySelectedImage('wrap-left')">Left</button>
                    <button onclick="modifySelectedImage('center')">Center</button>
                    <button onclick="modifySelectedImage('wrap-right')">Right</button>
                    <span style="font-size: 0.8rem; color: var(--text-muted); margin: 0 10px;">Size:</span>
                    <button onclick="modifySelectedImage('shrink')">➖</button>
                    <button onclick="modifySelectedImage('grow')">➕</button>
                </div>

                <div id="editor" contenteditable="true" placeholder="Log your thoughts (UTC)..."></div>
                
                <div class="button-group editor-buttons">
                    <button id="publish-btn" class="primary-btn">Bake to Repository</button>
                    <button id="cancel-edit-btn" class="secondary-btn hidden" onclick="resetEditor()">Cancel Edit</button>
                    <button id="delete-post-btn" class="secondary-btn hidden delete-btn">🗑️ Delete</button>
                </div>
            </div>

            <div id="manage-tab" class="tab-content hidden">
                <div id="post-manager-list" class="manager-list">
                    <p>Loading historical posts...</p>
                </div>
            </div>
        </div>
    </div>
    
    <div id="delete-confirm-modal" class="modal hidden" style="z-index: 200;">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h3 style="margin-top:0;">Delete Post?</h3>
            <p style="color: var(--text-muted);">Are you sure you want to delete this post? This will also permanently remove any images used inside it from the repository. This cannot be undone.</p>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button id="confirm-delete-yes" class="primary-btn delete-btn">Yes, Delete</button>
                <button id="confirm-delete-no" class="secondary-btn">No, Cancel</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
